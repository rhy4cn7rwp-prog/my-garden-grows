function spot(x,y,w,h,action,title){return `<button class="spot" style="left:${x}%;top:${y}%;width:${w}%;height:${h}%" aria-label="${title}" title="${title}" onclick="${action}"><span class="tip">${title}</span></button>`}

if(view==='dream'){for(let [id,x,y,w,h] of [['ball',4,27,26,29],['bike',11,57,45,36],['tablet',77,23,21,37],['guitar',83,54,16,39],['camera',57,62,29,30],['puppy',50,30,25,29]])stage+=spot(x,y,w,h,`dream('${id}')`,DREAMS.find(d=>d[0]===id)[2]);bottom=`<h2>🎯 Dream Shop</h2><p>Tap a real item on the shelves to choose what you're saving for.</p><div class="progress"><span style="width:${Math.min(100,100*state.cash/DREAMS[state.goal][3])}%"></span></div><p>${money(state.cash)} saved toward ${DREAMS[state.goal][2]} (${money(DREAMS[state.goal][3])})</p>`}
if(view==='seeds'){let positions=[[12,47],[30,47],[48,47],[67,47],[84,47],[12,67],[30,67],[48,67],[67,67],[84,67]];CROPS.forEach((c,i)=>{let [x,y]=positions[i];stage+=spot(x-7,y-8,16,19,`seed('${c.id}')`,c.name+' seeds')});bottom=`<h2>🌰 Seed & Feed</h2><p>Tap a seed packet on the display to learn about it and add it to your basket.</p><button class="btn" onclick="cart('seeds')">🛒 Basket (${Object.values(state.cart).reduce((a,b)=>a+b,0)}) · ${money(CROPS.reduce((a,c)=>a+(state.cart[c.id]||0)*c.seed,0))}</button>`}
if(view==='garden'){stage+=`<div class="plantgrid">${state.plots.map((p,i)=>{let c=p&&crop(p.id),ready=p&&p.age>=c.days;return `<button class="plot ${ready?'ready':''}" onclick="plot(${i})" title="${p?c.name:'Empty plot'}">${!p?'':ready?c.icon:p.age>=2?'🌿':'🌱'}</button>`}).join('')}</div>`;bottom=`<h2>🌿 My Garden · 5 × 5</h2><p>Tap a plot to plant, inspect or harvest. ${state.watered?'💧 Watered today!':'Plants need water to grow.'}</p><div class="row"><button class="btn" onclick="water()">💧 Water all</button><button class="btn alt" onclick="endDay()">☀️ End day</button><button class="btn alt" onclick="inventory()">🧺 Harvest basket</button></div>`}
if(view==='supplies'){let ps=[['table',6,18,47,36],['canopy',57,18,40,40],['bags',8,57,40,35],['scale',52,57,44,35]];ps.forEach(([id,x,y,w,h])=>stage+=spot(x,y,w,h,`supply('${id}')`,SUPPLIES.find(s=>s[0]===id)[2]));bottom=`<h2>🧺 Market Supplies</h2><p>Tap the table, canopy, paper bags, or scale on the shelves.</p><button class="btn" onclick="cart('supplies')">🛒 Basket (${Object.values(state.supcart).reduce((a,b)=>a+b,0)})</button>`}
if(view==='market'){stage+=spot(3,57,31,40,"marketItem('carrot')",'Carrots')+spot(35,57,30,40,"marketItem('corn')",'Corn')+spot(66,57,33,40,"marketItem('cucumber')",'Cucumbers');let c=state.customer;if(state.hour>=13)bottom=`<h2>🍎 Market closed · 1 PM</h2><p>Today you earned ${money(state.sales)}!</p><button class="btn" onclick="nextMarket()">Open next market day</button>`;else {if(!c)newCustomer();c=state.customer;bottom=`<h2>🍎 Market Day · ${state.hour}:00</h2><p><b>${c.name}:</b> ${state.step==='greet'?'Hello!':state.step==='choose'?'Could I have '+Object.entries(c.want).map(([id,n])=>n+' '+crop(id).name).join(' and ')+'?':state.step==='thanks'?'Thanks so much!':'Let’s check out!'}</p><div class="row">${state.step==='greet'?`<button class="btn" onclick="state.step='choose';render()">😊 Welcome! What can I get you?</button>`:state.step==='choose'?`<button class="btn" onclick="order()">🧺 Fill customer basket</button><button class="btn alt" onclick="skip()">Sorry, sold out</button>`:state.step==='pay'?`<button class="btn" onclick="payment()">💵 Count change</button>`:`<button class="btn" onclick="advance()">👋 Next customer</button>`}</div><p class="small">${state.visitors} customers · ${money(state.sales)} in sales · ${state.owned.table?'Market table':'Blanket stand'}</p>`}}
$('#app').innerHTML=`<div class="game"><div class="stage" style="background-image:url('${ART[view]}')">${header()}${stage}</div><div class="bottom">${bottom}</div><div class="footer">My Garden Grows · Interactive storybook prototype 0.9</div></div>${popup}`}
function dream(id){let d=DREAMS.find(x=>x[0]===id);show(`<h2>${d[1]} ${d[2]}</h2><p class="tag">Price: ${money(d[3])}</p><p>${state.goal===DREAMS.indexOf(d)?'This is your current savings goal.':'Would you like to save your market earnings for this?'}</p><button class="btn" onclick="state.goal=${DREAMS.indexOf(d)};close()">🎯 ${state.goal===DREAMS.indexOf(d)?'Keep this goal':'Choose this dream'}</button>`)}
function seed(id){let c=crop(id);show(`<h2>${c.icon} ${c.name} Seeds</h2><p class="tag">${money(c.seed)} per seed packet</p><p>🌞 Sun-loving · 🌱 ${c.days} watered days to harvest</p><p>Harvest about ${c.yield} ${c.unit} · Sell for ${money(c.price)}/${c.unit}</p><p>${c.repeat?'🔁 Repeat harvests':'🌾 One harvest per planting'}</p><div class="qty"><button onclick="change('cart','${id}',-1)">−</button><b>${state.cart[id]||0} in basket</b><button onclick="change('cart','${id}',1)">+</button></div><div><button class="btn" onclick="cart('seeds')">🛒 View basket</button></div>`)}
function supply(id){let s=SUPPLIES.find(x=>x[0]===id);show(`<h2>${s[1]} ${s[2]}</h2><p class="tag">${money(s[3])}</p><p>${s[4]}</p><p>Already owned: ${state.owned[id]||0}</p><div class="qty"><button onclick="change('supcart','${id}',-1)">−</button><b>${state.supcart[id]||0} in basket</b><button onclick="change('supcart','${id}',1)">+</button></div><button class="btn" onclick="cart('supplies')">🛒 View basket</button>`)}
function change(kind,id,d){state[kind][id]=Math.max(0,(state[kind][id]||0)+d);if(view==='seeds')seed(id);else supply(id)}
function cart(kind){let items=kind==='seeds'?CROPS.map(c=>[c.id,c.icon+' '+c.name,c.seed]):SUPPLIES.map(s=>[s[0],s[1]+' '+s[2],s[3]]),obj=kind==='seeds'?state.cart:state.supcart;let chosen=items.filter(x=>obj[x[0]]);let total=chosen.reduce((a,x)=>a+obj[x[0]]*x[2],0);show(`<h2>🛒 Shopping Basket</h2>${chosen.length?chosen.map(x=>`<div class="basketline">${x[1]} × ${obj[x[0]]} = ${money(x[2]*obj[x[0]])}</div>`).join(''):'<p>Your basket is empty. Tap an item on the shelves.</p>'}<p><b>Total: ${money(total)}</b> · You have ${money(state.cash)}</p><button class="btn" ${!total?'disabled':''} onclick="checkout('${kind}')">Pay at checkout</button><button class="btn alt" onclick="close()">Keep shopping</button>`)}
function checkout(kind){let items=kind==='seeds'?CROPS.map(c=>[c.id,c.seed]):SUPPLIES.map(s=>[s[0],s[3]]),obj=kind==='seeds'?state.cart:state.supcart,total=items.reduce((a,[id,p])=>a+(obj[id]||0)*p,0);if(!total)return;if(total>state.cash)return alert('You need more money. Try fewer items.');state.cash-=total;for(let [id] of items){if(kind==='seeds')state.seeds[id]=(state.seeds[id]||0)+(obj[id]||0);else state.owned[id]=(state.owned[id]||0)+(obj[id]||0)}state[kind==='seeds'?'cart':'supcart']={};popup='';render();show(`<h2>🎉 Purchase complete!</h2><p>You spent ${money(total)}. You have ${money(state.cash)} remaining.</p><button class="btn" onclick="go('${kind==='seeds'?'garden':'market'}')">${kind==='seeds'?'🌱 Go plant':'🍎 Go to market'}</button>`)}
function plot(i){let p=state.plots[i];if(!p){let options=CROPS.filter(c=>(state.seeds[c.id]||0)>0);if(!options.length)return show(`<h2>🌱 Empty garden plot</h2><p>You need seeds first!</p><button class="btn" onclick="go('seeds')">Visit Seed & Feed</button>`);show(`<h2>🌱 Plant this plot</h2><p>Choose a seed packet from your bag:</p>${options.map(c=>`<button class="btn alt" onclick="plant(${i},'${c.id}')">${c.icon} ${c.name} (${state.seeds[c.id]})</button>`).join('')}`);return}let c=crop(p.id);if(p.age>=c.days){show(`<h2>${c.icon} ${c.name} ready!</h2><p>Harvest ${c.yield} ${c.unit} of ${c.name}.</p><button class="btn" onclick="harvest(${i})">🧺 Harvest</button>`)}else show(`<h2>${c.icon} Growing ${c.name}</h2><p>Day ${p.age} of ${c.days} watered days.</p><p>${c.repeat?'This crop can produce several harvests.':'This crop produces one harvest.'}</p><p>Estimated market value ${money(c.price)} per ${c.unit}.</p>`)}
function plant(i,id){state.plots[i]={id,age:0};state.seeds[id]--;close()}function harvest(i){let p=state.plots[i],c=crop(p.id);state.inventory[c.id]=(state.inventory[c.id]||0)+c.yield;if(c.repeat)p.age=Math.max(0,c.days-2);else state.plots[i]=null;close()}
function water(){state.watered=true;render()}function endDay(){state.day++;if(state.day>20){state.day=1;state.season++}for(let p of state.plots)if(p&&state.watered)p.age++;state.watered=false;state.hour=9;state.visitors=0;state.sales=0;state.customer=null;render()}function inventory(){show(`<h2>🧺 Harvest Basket</h2>${CROPS.filter(c=>state.inventory[c.id]).map(c=>`<div class="basketline">${c.icon} ${c.name}: ${state.inventory[c.id]} ${c.unit}</div>`).join('')||'<p>Nothing harvested yet. Water your plants and advance days.</p>'}<button class="btn" onclick="go('market')">🍎 Go sell produce</button>`)}
function newCustomer(){let idx=(state.day*3+state.visitors)%PEOPLE.length;let available=CROPS.filter(c=>state.inventory[c.id]>0);let wanted=available.length?available:[CROPS[idx%CROPS.length]];state.customer={name:PEOPLE[idx],want:{[wanted[0].id]:1+(idx%2)}};state.basket={};state.change=0;state.step='greet';state.visitors++}
function marketItem(id){if(view!=='market')return;let c=crop(id);show(`<h2>${c.icon} ${c.name}</h2><p>On hand: ${state.inventory[id]||0} ${c.unit}</p><p>Price: ${money(c.price)} per ${c.unit}</p><p>Tap “Fill customer basket” to serve the current shopper.</p>`)}
function order(){let c=state.customer;show(`<h2>🧺 ${c.name}'s order</h2><p>Customer requests: ${Object.entries(c.want).map(([id,n])=>n+' '+crop(id).name).join(', ')}</p>${Object.entries(c.want).map(([id,n])=>`<div class="basketline">${crop(id).icon} ${crop(id).name} · in stock ${state.inventory[id]||0} · ${money(crop(id).price)}/${crop(id).unit}<div class="qty"><button onclick="basketChange('${id}',-1)">−</button><b>${state.basket[id]||0} / ${n}</b><button onclick="basketChange('${id}',1)">+</button></div></div>`).join('')}<button class="btn" onclick="ring()">⚖️ Ring up purchase</button>`)}
function basketChange(id,d){let need=state.customer.want[id];state.basket[id]=Math.max(0,Math.min(need,state.inventory[id]||0,(state.basket[id]||0)+d));order()}
function totalOrder(){return Object.entries(state.basket).reduce((a,[id,n])=>a+n*crop(id).price,0)}function ring(){let c=state.customer;if(Object.entries(c.want).some(([id,n])=>(state.basket[id]||0)!==n))return alert('Please fill the requested order, or choose sold out.');if(Object.entries(state.basket).some(([id,n])=>n&&crop(id).unit==='lb'&&!state.owned.scale))return alert('You need a scale for produce sold by the pound. Visit Market Supplies.');let t=totalOrder();if(!t)return alert('There is no produce in the basket.');state.tendered=[5,10,20,50,100].find(n=>n>=t)||100;state.step='pay';close()}
function payment(){let t=totalOrder(),due=state.tendered-t;show(`<h2>💵 Cash Register</h2><p>Order total: <b>${money(t)}</b></p><p>${state.customer.name} gives you <b>${money(state.tendered)}</b>.</p><p>Count back the change: <b>${money(due)}</b></p><div class="row">${[0.01,0.05,0.1,0.25,1,5,10,20].map(n=>`<button class="btn alt coin" onclick="addMoney(${n})">${n<1?Math.round(n*100)+'¢':'$'+n}</button>`).join('')}</div><p class="note">Change counted: ${money(state.change)}</p><button class="btn alt" onclick="state.change=0;payment()">Start over</button><button class="btn" onclick="finish()">Give change</button>`)}function addMoney(n){state.change=Math.round((state.change+n)*100)/100;payment()}
function finish(){let due=state.tendered-totalOrder();if(Math.abs(due-state.change)>.009)return alert('Not quite! Count back exactly '+money(due));let t=totalOrder();for(let [id,n] of Object.entries(state.basket))state.inventory[id]-=n;state.cash+=t;state.sales+=t;state.step='thanks';close();if(state.cash>=DREAMS[state.goal][3]&&!state.won){state.won=true;show(`<h2>🎉 Dream achieved!</h2><p>You saved enough for your ${DREAMS[state.goal][2]}!</p><p>You can keep growing and selling.</p>`)}}
function skip(){state.step='thanks';render()}function advance(){state.hour++;state.customer=null;render()}function nextMarket(){state.hour=9;state.visitors=0;state.sales=0;state.customer=null;render()}
function settings(){show(`<h2>⚙️ Farm Settings</h2><p>Progress is saved in this browser.</p><button class="btn alt" onclick="reset()">Start a new farm</button>`)}function reset(){if(confirm('Erase this farm and start again with $50?')){state=initial();go('town')}}
render();
</script></body></html>
