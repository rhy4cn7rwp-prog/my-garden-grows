function characterArt(i=0){let hair=['#75482f','#bc7d42','#553b2d','#9a6437','#473a2f'][i%5],shirt=['#6da7b7','#db8a69','#9f8cc2','#76aa72','#c7a15d'][i%5],skin=['#f5cba4','#e7b083','#d69b72','#f1c49c'][i%4];return `<svg viewBox="0 0 100 110" role="img" aria-label="Customer portrait"><path d="M9 105Q9 68 48 70Q91 68 91 105" fill="${shirt}" stroke="#6b6a5c" stroke-width="3"/><ellipse cx="50" cy="44" rx="31" ry="35" fill="${skin}"/><path d="M19 39Q10 3 48 5Q86 2 82 40Q67 21 51 25Q33 17 19 39" fill="${hair}"/><circle cx="39" cy="45" r="3.5" fill="#44382e"/><circle cx="62" cy="45" r="3.5" fill="#44382e"/><path d="M39 61Q50 72 62 60" fill="none" stroke="#9b5e4d" stroke-width="3" stroke-linecap="round"/><circle cx="24" cy="56" r="7" fill="${skin}"/><circle cx="76" cy="56" r="7" fill="${skin}"/></svg>`}
function back(){return `<button class="btn small back" onclick="go('town')">← Back to town</button>`}
function town(){return `<section class="panel"><h2>Welcome to your village!</h2><p class="muted">Tap a building to go inside. Your garden is yours to grow, and your town is full of neighbors!</p><div class="scene">${townSVG()}<button class="hotspot town-dream" onclick="go('dream')">🎁 Dream Shop</button><button class="hotspot town-seeds" onclick="go('seeds')">🌰 Seed & Feed</button><button class="hotspot town-garden" onclick="go('garden')">🌿 My Garden</button><button class="hotspot town-market" onclick="go('market')">🍎 Market</button><div class="tip">👩‍🌾 “Here's your plot! Pick a dream, buy seeds, and grow something wonderful!”</div></div><div class="row between" style="margin-top:13px"><button class="btn gold" onclick="nextDay()">🌅 End day</button><button class="btn" onclick="go('supply')">🛍️ Supply store</button></div></section><section class="panel"><h3>📖 Your farm journal</h3><p>🌤️ ${s.weather==='hot'?'Hot and sunny':'Sunny skies'} · ${s.garden.filter(Boolean).length} planted plots · ${Object.values(s.inventory).reduce((a,b)=>a+b,0)} items harvested</p><p class="muted">Goal: ${goals[s.goal][0]} (${fmt(goals[s.goal][1])}). You have ${fmt(s.money)}.</p><div class="progress"><div style="width:${Math.min(100,s.money/goals[s.goal][1]*100)}%"></div></div>${s.money>=goals[s.goal][1]?'<p>🎉 You reached your savings goal! Keep farming or start a new adventure.</p>':''}</section>`}
function dream(){return `${back()}<section class="panel"><h2>🎁 Dream Shop</h2><div class="shop-scene">${shopArt('dream')}<div class="shop-dialog">“Welcome! What wonderful thing are you saving up for?”</div></div><div class="products">${goals.map((g,i)=>`<div class="product" style="text-align:center"><div style="font-size:52px">${g[2]}</div><h3>${g[0]}</h3><div class="price">${fmt(g[1])}</div><button class="btn ${s.goal===i?'primary':''}" onclick="s.goal=${i};msg('Great goal! Visit the Seed & Feed shop next.')">${s.goal===i?'✓ Selected':'Choose'}</button></div>`).join('')}</div><p class="muted">Your money: ${fmt(s.money)}. Save enough to buy your dream reward!</p><button class="btn primary" onclick="go('town')">🚪 Leave shop</button></section>`}
function cartQty(id,d){s.cart[id]=Math.max(0,Math.min(50,count(s.cart,id)+d));render()}function bundleQty(d){s.bundle=Math.max(0,Math.min(10,s.bundle+d));render()}function cartTotal(){return crops.reduce((a,c)=>a+c.cost*count(s.cart,c.id),0)+s.bundle*11}function checkout(){let t=cartTotal();if(!t)return msg('Your cart is empty. Add some seeds first.');if(t>s.money)return msg('Your cart costs more than you have. Remove a few items before checkout.');s.money-=t;crops.forEach(c=>s.seeds[c.id]=count(s.seeds,c.id)+count(s.cart,c.id));for(let n=0;n<s.bundle;n++)for(const [id,qty] of Object.entries({carrot:3,onion:2,beans:2,strawberry:1}))s.seeds[id]=count(s.seeds,id)+qty;s.cart={};s.bundle=0;msg('🛍️ Checkout complete! You spent '+fmt(t)+'. Your seeds are waiting in your garden bag.')}function packet(id){let c=crop(id);modal(`<div class="row between"><h2>${c.name} packet</h2><button class="btn small" onclick="closeModal()">✕</button></div><div class="bigplant">${cropArt(id,3)}</div><p><b>Seed cost:</b> ${fmt(c.cost)} · <b>Estimated sale price:</b> ${fmt(c.price)} / ${c.unit}</p><p><b>First harvest:</b> ${c.days} days · <b>Harvest:</b> ${c.yield} ${c.unit}${c.repeat?' × '+(c.repeat+1)+' pickings':''}</p><p>☀️ ${c.sun}. ${c.tip}</p><div class="info">💰 Potential gross sales: <b>${fmt(c.price*c.yield*(c.repeat+1))}</b> if every harvest sells. Actual sales may be lower; growing and market costs are extra.</div><button class="btn primary" onclick="closeModal()">Got it!</button>`)}
function seeds(){return `${back()}<section class="panel"><h2>🌰 Local Seed & Feed</h2><div class="shop-scene">${shopArt('seed')}<div class="shop-dialog">“Welcome! Compare seed costs and harvest value. Add to your cart, then check out!”</div></div><div class="info bundle"><b>📦 Variety bundle · $11</b><div class="muted">3 carrots, 2 onions, 2 beans, 1 strawberry · individually $13 · save $2</div><div class="row between"><span>In cart: <b>${s.bundle}</b></span><div class="step"><button onclick="bundleQty(-1)">−</button><button onclick="bundleQty(1)">+</button></div></div></div><div class="products">${crops.map(c=>`<div class="product"><div class="art">${cropArt(c.id,3)}</div><h3>${c.name}</h3><div class="price">${fmt(c.cost)} / packet</div><div class="muted">Sell ~${fmt(c.price)}/${c.unit}</div><div class="muted">${c.days} days · ${c.repeat?'multiple harvests':'one harvest'}</div><button class="btn small" onclick="packet('${c.id}')">ℹ️ Seed packet</button><div class="step" style="margin-top:7px"><button onclick="cartQty('${c.id}',-1)">−</button><b>${count(s.cart,c.id)}</b><button onclick="cartQty('${c.id}',1)">+</button></div></div>`).join('')}</div><div class="sticky"><div class="row between"><b>🛒 ${Object.values(s.cart).reduce((a,b)=>a+b,0)+s.bundle} items · ${fmt(cartTotal())}</b><button class="btn primary" onclick="checkout()">Check out</button></div><div class="muted">Cash available: ${fmt(s.money)}. No purchase until checkout.</div></div><button class="btn" onclick="go('town')">🚪 Leave store</button></section>`}
function selectSeed(id){s.selected=id;render()}function tapPlot(i){let p=s.garden[i];if(p){if(p.ready)return harvest(i);inspect(i);return}if(s.plan[i]){delete s.plan[i];return msg('Removed seed from your plan. You can place it elsewhere.')}let reserved=Object.values(s.plan).filter(id=>id===s.selected).length;if(count(s.seeds,s.selected)<=reserved)return msg('No '+crop(s.selected).name+' seeds left in your bag. Visit the seed store!');s.plan[i]=s.selected;msg('Planned a '+crop(s.selected).name+' planting. Move it by tapping again, or press Plant!')}
function plant(){let entries=Object.entries(s.plan);if(!entries.length)return msg('First tap some empty soil squares to plan where to plant.');entries.forEach(([i,id])=>{s.garden[+i]={id,age:0,watered:true,ready:false,left:crop(id).repeat,quality:100};s.seeds[id]--});s.plan={};msg('🌱 Planted '+entries.length+' plots! Tap growing plants to inspect them.')}function inspect(i){let p=s.garden[i],c=crop(p.id);modal(`<div class="row between"><h2>🌿 ${c.name}</h2><button class="btn small" onclick="closeModal()">✕</button></div><div class="bigplant">${cropArt(p.id,p.ready?3:Math.min(3,Math.ceil(p.age/c.days*3)))}</div><p><b>Growth:</b> ${p.age}/${c.days} days ${p.ready?'· Ready to harvest!':''}</p><p><b>Water:</b> ${p.watered?'Watered today':'Needs water'} · <b>Quality:</b> ${p.quality}%</p><p>☀️ ${c.sun} · ${c.tip}</p><p><b>Expected harvest:</b> ${c.yield} ${c.unit} · ${fmt(c.price)}/${c.unit} estimated sale price</p><button class="btn primary" onclick="closeModal()">Back to garden</button>`)}function harvest(i){let p=s.garden[i],c=crop(p.id);let qty=p.quality<60?Math.max(1,c.yield-1):c.yield;s.inventory[p.id]=count(s.inventory,p.id)+qty;if(p.left>0){p.left--;p.age=0;p.ready=false;p.watered=false}else s.garden[i]=null;msg('🧺 Harvested '+qty+' '+c.unit+' of '+c.name+'! '+(p.left>0?'This plant can grow another harvest.':'This plot is free to replant.'))}function water(){s.garden.forEach(p=>{if(p)p.watered=true});msg('💧 All your plants are watered.')}function nextDay(){s.day++;s.weather=s.day%7===0?'hot':'sunny';let ready=0;s.garden.forEach(p=>{if(!p||p.ready)return;if(p.watered){p.age++;p.watered=false}else p.quality=Math.max(35,p.quality-(s.weather==='hot'?25:12));if(s.weather==='hot'&&p.id==='strawberry'&&!p.watered)p.quality=Math.max(30,p.quality-10);if(p.age>=crop(p.id).days){p.ready=true;ready++}});s.marketOpen=false;s.customer=null;s.stage='';msg((s.weather==='hot'?'☀️ Hot weather! Watering matters. ':'🌤️ A new morning! ')+(ready?ready+' plots are ready to harvest.':'Your crops are growing.'))}
function garden(){let selected=crop(s.selected);return `${back()}<section class="panel"><h2>🌿 My Garden · 6 × 6 plots</h2><p class="muted">Tap a seed packet, then tap soil to arrange it. You can change the plan until you press Plant. Tap growing plants for a close-up; tap ripe plants to harvest.</p><div class="seed-picks">${crops.map(c=>`<button class="${s.selected===c.id?'selected':''}" onclick="selectSeed('${c.id}')">${cropArt(c.id,3)}${c.name}<div class="muted">Bag: ${count(s.seeds,c.id)}</div></button>`).join('')}</div><div class="info">${cropArt(selected.id,3).replace('<svg ','<svg style="width:45px;height:45px;float:left;margin-right:8px" ')}<b>${selected.name}:</b> ${selected.days} days · ${selected.sun} · ~${fmt(selected.price)}/${selected.unit}. <button class="btn small" onclick="packet('${selected.id}')">Read packet</button></div><div class="garden-wrap"><div class="garden-grid">${s.garden.map((p,i)=>{let planned=s.plan[i],id=p?p.id:planned,stage=p?(p.ready?3:Math.min(3,Math.ceil(p.age/crop(id).days*3))):0;return `<button class="plot ${planned?'plan':''} ${p&&p.ready?'ready':''}" onclick="tapPlot(${i})" aria-label="Plot ${i+1} ${id?crop(id).name:'empty'}">${id?cropArt(id,stage):'<span style="color:#d7ad77">✦</span>'}<small>${p?(p.ready?'HARVEST':crop(id).name.split(' ')[0]+' '+p.age+'/'+crop(id).days):planned?'PLAN':''}</small></button>`}).join('')}</div></div><div class="row"><button class="btn primary" onclick="plant()">🌱 Plant (${Object.keys(s.plan).length})</button><button class="btn" onclick="water()">💧 Water all</button><button class="btn gold" onclick="nextDay()">🌅 End day</button></div><h3>🧺 Harvest basket</h3><div class="crate-list">${crops.filter(c=>count(s.inventory,c.id)).map(c=>`<div class="crate">${cropArt(c.id,3)}${c.name}<br>${count(s.inventory,c.id)} ${c.unit}</div>`).join('')||'<p class="muted">Nothing harvested yet.</p>'}</div></section>`}
function supplyAdd(id){s.supplyCart[id]=Math.max(0,Math.min(1,count(s.supplyCart,id)+1));render()}const supplyList=[['table','Market table',8,'🪵'],['canopy','Shade canopy',10,'⛱️'],['bags','Produce bags',3,'🛍️'],['scale','Weighing scale',5,'⚖️']];function supplyCheckout(){let items=supplyCartItems(),t=items.reduce((a,x)=>a+x[2],0);if(!items.length)return msg('Your supply cart is empty.');if(t>s.money)return msg('Not enough money for those supplies.');s.money-=t;items.forEach(x=>s.supplies[x[0]]=true);s.supplyCart={};msg('Purchased market supplies for '+fmt(t)+'!')}function supplyCartItems(){return supplyList.filter(x=>count(s.supplyCart,x[0])&&!s.supplies[x[0]])}function supply(){return `${back()}<section class="panel"><h2>🛍️ Market Supply Shop</h2><div class="shop-scene">${shopArt('supplies')}<div class="shop-dialog">“A blanket is free! Upgrade your stand as your farm earns money.”</div></div>${supplyList.map(([id,name,price,emoji])=>`<div class="orderline"><span style="font-size:32px">${emoji}</span><div class="grow"><b>${name}</b><div class="price">${fmt(price)}</div><div class="muted">${({table:'Attracts more customers',canopy:'Protects produce from hot sun',bags:'Useful for loose produce',scale:'Lets you sell produce by the pound'})[id]}</div></div><button class="btn small ${s.supplies[id]?'':'primary'}" onclick="supplyAdd('${id}')" ${s.supplies[id]||s.supplyCart[id]?'disabled':''}>${s.supplies[id]?'Owned':s.supplyCart[id]?'In cart':'Add'}</button></div>`).join('')}<div class="sticky row between"><b>Cart: ${fmt(supplyCartItems().reduce((a,x)=>a+x[2],0))}</b><button class="btn primary" onclick="supplyCheckout()">Check out</button></div><button class="btn" onclick="go('market')">Go to market →</button></section>`}
function marketSVG(){return `<svg viewBox="0 0 600 260" role="img" aria-label="Illustrated market stand with colorful produce"><rect width="600" height="260" fill="#9dd3e4"/><path d="M0 145Q190 100 330 144T600 124V260H0" fill="#8dbf70"/><path d="M0 204H600V260H0" fill="#e2c394"/><path d="M76 102L140 22H461L529 102Z" fill="${s.supplies.canopy?'#e66f59':'#f1d6a0'}" stroke="#986a44" stroke-width="7"/>${s.supplies.canopy?'<path d="M185 25V101M285 25V101M385 25V101" stroke="#fff2d7" stroke-width="20"/>':''}<rect x="108" y="101" width="385" height="119" rx="12" fill="${s.supplies.table?'#b17c48':'#d6b78b'}" stroke="#8e643f" stroke-width="8"/><rect x="96" y="113" width="406" height="19" rx="6" fill="#e8bb7b"/>${[0,1,2,3,4].map((i)=>`<g transform="translate(${148+i*71} 124)"><rect x="-30" y="-12" width="60" height="50" rx="6" fill="#9b663d" stroke="#72462b" stroke-width="4"/><circle cx="-12" cy="3" r="12" fill="${['#ed634f','#6aaa50','#e7bf42','#e95a54','#7bb85b'][i]}"/><circle cx="11" cy="4" r="12" fill="${['#ee974a','#75b656','#e4d05b','#e86055','#68a651'][i]}"/></g>`).join('')}<rect x="236" y="61" width="128" height="41" rx="9" fill="#fff2ce" stroke="#ab8253" stroke-width="5"/><text x="300" y="88" font-family="Georgia" font-weight="bold" text-anchor="middle" font-size="21" fill="#47663e">MY MARKET</text></svg>`}
function setDisplay(id,d){let limit=count(s.inventory,id);s.display[id]=Math.max(0,Math.min(limit,count(s.display,id)+d));render()}function marketSetup(){return `${back()}<section class="panel"><h2>🍎 Your Farmers Market</h2><div class="market-stage">${marketSVG()}</div><div class="info">${s.supplies.table?'🪵 Table set up':'🧺 Selling from a blanket (free)'} · ${s.supplies.canopy?'⛱️ Shaded':'☀️ Open sun'} · ${s.supplies.bags?'🛍️ Bags ready':'No bags'} · ${s.supplies.scale?'⚖️ Scale ready':'No scale'}</div><p class="muted">Place produce on your display. You can sell from a blanket, but without a scale you cannot sell by the pound, and without bags customers prefer individual items.</p><div class="crate-list">${crops.map(c=>`<div class="crate">${cropArt(c.id,3)}${c.name}<div class="muted">Basket ${count(s.inventory,c.id)}</div><div class="step"><button onclick="setDisplay('${c.id}',-1)">−</button><b>${count(s.display,c.id)}</b><button onclick="setDisplay('${c.id}',1)">+</button></div></div>`).join('')}</div><div class="row" style="margin-top:13px"><button class="btn primary" onclick="openMarket()">🔔 Open market · 9 a.m.</button><button class="btn" onclick="go('supply')">Buy upgrades</button></div></section>`}
function openMarket(){if(!Object.values(s.display).some(Boolean))return msg('Put some harvested produce on your display first.');s.marketOpen=true;s.marketHour=9;s.marketDay=s.day;s.visitors=0;s.customer=null;s.stage='';msg('🔔 The market is open! Customers can visit between 9 a.m. and 1 p.m.')}function currentOrder(){return s.customer?s.customer.items:[]}function orderTotal(){return currentOrder().reduce((a,x)=>a+crop(x.id).price*x.qty,0)}function payAmount(){let t=orderTotal();return t<=5?10:t<=10?20:Math.ceil(t/20)*20}function nextCustomer(){if(s.marketHour>=13)return msg('The market is closed for today. Come back tomorrow!');if(s.customer)return msg('Finish helping this customer first.');let i=s.customerIndex%names.length;let stocked=crops.filter(c=>count(s.display,c.id)>0);let requests=[];if(i%5===4){let unavailable=crops.find(c=>count(s.display,c.id)===0);if(unavailable)requests=[{id:unavailable.id,qty:1}]}if(!requests.length){let a=stocked[i%stocked.length];requests=[{id:a.id,qty:Math.min(count(s.display,a.id),i%3===0?2:1)}];if(stocked.length>1&&i%3!==0){let b=stocked[(i+1)%stocked.length];if(b.id!==a.id)requests.push({id:b.id,qty:1})}}s.customer={i,items:requests};s.picked={};s.stage='greet';s.change=0;s.customerIndex++;s.visitors++;s.marketHour+=.5;msg(names[i]+' has arrived at your market!')}
function greet(kind){s.stage='pick';msg(kind==='friendly'?'Your customer smiles. Let’s fill their shopping basket!':'Your customer tells you what they need.')}function pick(id){let target=currentOrder().find(x=>x.id===id);if(!target)return;let available=count(s.display,id);if(count(s.picked,id)>=Math.min(target.qty,available))return msg('You have already selected all available '+crop(id).name+'.');s.picked[id]=count(s.picked,id)+1;render()}function clearPick(){s.picked={};render()}function completePick(){let missing=currentOrder().filter(o=>count(s.display,o.id)<o.qty);if(missing.length){s.stage='bye';return msg('Sorry, you are sold out of '+missing.map(x=>crop(x.id).name).join(' and ')+'. This customer will leave without buying.')}let unpicked=currentOrder().filter(o=>count(s.picked,o.id)<o.qty);if(unpicked.length)return msg('Tap each item to fill the shopping basket before checkout.');let pounds=currentOrder().some(o=>crop(o.id).unit==='lb');if(pounds&&!s.supplies.scale){s.stage='bye';return msg('You need a scale to sell produce by the pound. This customer could not complete their order.')}s.stage='cash';msg('Great! The total is '+fmt(orderTotal())+'. Count change back to your customer.')}
function addMoney(v){let due=Math.round((payAmount()-orderTotal())*100)/100;s.change=Math.round((s.change+v)*100)/100;if(s.change>due+.001)return msg('Too much change! Tap Reset and try again.');if(Math.abs(s.change-due)<.001){currentOrder().forEach(o=>{s.inventory[o.id]-=o.qty;s.display[o.id]-=o.qty});s.money+=orderTotal();s.sales+=orderTotal();s.stage='bye';return msg('🎉 Correct change! You earned '+fmt(orderTotal())+'. Say goodbye to your customer.')}msg('Counted back '+fmt(s.change)+'. Total counted up to '+fmt(orderTotal()+s.change)+' of '+fmt(payAmount())+'.')}
function bye(){s.customer=null;s.stage='';msg('👋 Your neighbor heads home. Welcome another customer or close the market.')}function closeMarket(){s.marketOpen=false;s.customer=null;s.stage='';s.marketHour=13;msg('🌇 The market is closed. Come back after another day of growing!')}
function market(){if(!s.marketOpen||s.marketDay!==s.day)return marketSetup();let c=s.customer,stage=s.stage,order=currentOrder(),due=payAmount()-orderTotal();return `${back()}<section class="panel"><h2>🍎 Market Day</h2><div class="market-stage">${marketSVG()}</div><div class="info">🕘 ${s.marketHour%1?'9:30'.replace('9',String(Math.floor(s.marketHour))):Math.floor(s.marketHour)+':00'} a.m. · Closes at 1 p.m. · ${s.visitors} customers visited · Sales ${fmt(s.sales)}</div>${!c?`<div class="character">${characterArt(2)}<div>“Welcome! Your stand is open. Who will visit next?”</div></div><div class="row"><button class="btn primary" onclick="nextCustomer()" ${s.marketHour>=13?'disabled':''}>🔔 Next customer</button><button class="btn" onclick="closeMarket()">Close market</button></div>`:`<div class="character">${characterArt(c.i)}<div><b>${names[c.i]}</b><div>“${stage==='greet'?'Hello there!':stage==='pick'?'Could I buy these, please?':stage==='cash'?'Here is '+fmt(payAmount())+'.':'Thank you!'}”</div></div></div>${stage==='greet'?`<h3>How will you greet your customer?</h3><div class="row"><button class="btn primary" onclick="greet('friendly')">😊 Hi! What can I get for you?</button><button class="btn" onclick="greet('short')">Hello!</button></div>`:''}${stage==='pick'||stage==='cash'||stage==='bye'?`<h3>🧺 Shopping list</h3>${order.map(o=>`<div class="orderline">${cropArt(o.id,3)}<div class="grow"><b>${crop(o.id).name}</b><div class="muted">${o.qty} ${crop(o.id).unit} × ${fmt(crop(o.id).price)}</div><div class="price">${fmt(o.qty*crop(o.id).price)}</div></div>${stage==='pick'?`<button class="btn small" onclick="pick('${o.id}')">Pick ${count(s.picked,o.id)}/${o.qty}</button>`:''}</div>`).join('')}<p><b>Order total: ${fmt(orderTotal())}</b></p>`:''}${stage==='pick'?`<p class="muted">Tap Pick for each requested item. If you're sold out, the customer may leave.</p><div class="row"><button class="btn primary" onclick="completePick()">🧺 Prepare order</button><button class="btn" onclick="clearPick()">Clear basket</button></div>`:''}${stage==='cash'?`<div class="info"><b>Customer pays: ${fmt(payAmount())}</b><br>Sale: ${fmt(orderTotal())} · Change needed: ${fmt(due)}<br>Counted back: <b>${fmt(s.change)}</b><br>Counting up: ${fmt(orderTotal()+s.change)} → ${fmt(payAmount())}</div><p class="muted">Tap illustrated bills and coins to count change back.</p><div class="money-tray">${[1,5,10,20,.25,.10,.05,.01].map(v=>`<button onclick="addMoney(${v})"><span class="${v>=1?'bill':'coin'}">${v>=1?'$'+v:Math.round(v*100)+'¢'}</span></button>`).join('')}</div><button class="btn" onclick="s.change=0;msg('Change reset. Try counting up again!')">↺ Reset change</button>`:''}${stage==='bye'?`<h3>Say goodbye!</h3><div class="row"><button class="btn primary" onclick="bye()">👋 Thank you! Come again!</button><button class="btn" onclick="bye()">Hope to see you again!</button></div>`:''}`}</section>`}
function openMenu(){modal(`<h2>⚙️ Farm settings</h2><p>Your progress is saved in this browser.</p><p><b>Day:</b> ${s.day} · <b>Money:</b> ${fmt(s.money)}</p><button class="btn danger" onclick="restart()">🌱 Start new farm</button><p class="muted">Restarting clears this version's saved game and returns you to $50.</p><button class="btn" onclick="closeModal()">Close</button>`)}function restart(){if(!confirm('Start a new farm? This resets all your progress in prototype 0.4.'))return;s=initial();closeModal();render()}
function render(){save();$('stats').innerHTML=`<span class="pill">💵 ${fmt(s.money)}</span><span class="pill">☀️ Season ${Math.floor((s.day-1)/20)+1} · Day ${((s.day-1)%20)+1}/20</span><span class="pill">🎯 ${goals[s.goal][2]} ${fmt(goals[s.goal][1])}</span>`;$('message').textContent=s.message||'';$('screen').innerHTML=({town,dream,seeds,garden,supply,market})[s.view]();}render();
</script></body></html>
