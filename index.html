:root{--ink:#25422f;--green:#317e4a;--pale:#edf6df;--cream:#fffaf0;--gold:#f9d889;--line:#d8dfcb}*{box-sizing:border-box}body{margin:0;background:#eaf1e2;color:var(--ink);font:16px/1.42 system-ui,-apple-system,Arial}button{font:inherit;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.4;cursor:default}.app{max-width:960px;margin:auto;min-height:100vh;background:#f8f8ed;box-shadow:0 0 25px #263e2420}.header{padding:16px;background:linear-gradient(120deg,#cce9bd,#f9ebbe);border-bottom:4px solid #a9c997}.header h1{font-size:clamp(23px,5vw,35px);margin:0}.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}.pill{background:#fffdf5;border:2px solid #e0e7ce;border-radius:30px;padding:6px 12px;font-weight:750;font-size:14px}.tabs{display:flex;overflow-x:auto;gap:6px;padding:10px;background:#fff9e9;scrollbar-width:thin}.tabs button{white-space:nowrap;border:0;border-radius:12px;padding:11px 13px;background:#e2e9d5;color:var(--ink);font-weight:750}.tabs button.active,.primary{background:var(--green)!important;color:white!important}.main{padding:14px 15px 35px}.message{background:#edf5e5;border-left:5px solid #72a85d;padding:11px 13px;border-radius:10px;margin-bottom:12px}.panel{background:#fffefa;border:2px solid var(--line);border-radius:19px;padding:15px;margin-bottom:14px;box-shadow:0 4px 0 #dfe7d1}.panel h2{margin:0 0 8px;font-size:24px}.panel h3{margin:8px 0}.muted{color:#647265;font-size:14px}.btn{border:0;border-radius:12px;padding:10px 14px;background:#e0ebd4;color:var(--ink);font-weight:750}.btn.primary{background:var(--green);color:white}.btn.warn{background:#f9e2a8}.btn.small{padding:6px 10px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:#f6f9ed;border:2px solid #d9e5ce;border-radius:14px;padding:12px}.card.selected{border-color:#398850;background:#e4f4df}.bigemoji{font-size:45px;line-height:1.3}.town{position:relative;min-height:460px;border:5px solid #b5d4a0;border-radius:20px;overflow:hidden;background:radial-gradient(circle at 65% 65%,#f3dc9b 0 6%,transparent 7%),linear-gradient(140deg,#9dd9ee 0 15%,#a9d77b 15% 100%)}.path{position:absolute;left:15%;top:44%;width:78%;height:24%;background:#f3dba7;border-radius:50%;transform:rotate(-22deg);border:7px solid #e7ca8b}.building{position:absolute;border:3px solid #e3c18b;border-radius:15px;background:#fff7dc;box-shadow:0 5px 0 #a5ba7c;padding:8px;text-align:center;font-weight:850;color:#30492d;min-width:105px}.building span{display:block;font-size:46px}.b-dream{top:7%;left:7%}.b-seeds{top:8%;right:7%}.b-garden{bottom:8%;left:7%}.b-market{bottom:8%;right:7%}.towncenter{position:absolute;top:41%;left:23%;width:54%;background:#fffdf2e9;border:2px solid #a1b985;border-radius:14px;padding:10px;text-align:center;font-size:14px}.store{background:linear-gradient(#f9e8b8,#fffaf0 115px);border:4px solid #d8aa67;border-radius:20px;padding:13px}.storetop{text-align:center;font-size:30px;font-weight:900;text-shadow:0 2px white;margin-bottom:8px}.shoprow{display:flex;gap:10px;align-items:center;border-bottom:1px dashed #c7cba9;padding:10px 0}.shoprow:last-child{border:0}.shoprow .ico{font-size:36px;width:47px;text-align:center}.shoprow .info{flex:1;min-width:0}.price{font-weight:850;color:#267341}.stepper{display:flex;align-items:center;gap:5px}.stepper button{border:0;background:#d6e8c9;border-radius:8px;min-width:33px;height:35px;font-weight:900}.stepper strong{min-width:24px;text-align:center}.sticky{position:sticky;bottom:8px;background:#fff8dd;border:2px solid #c8b87f;border-radius:15px;padding:10px;margin-top:10px;box-shadow:0 3px 8px #0002}.gridgarden{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;margin:12px 0}.plot{aspect-ratio:1;background:repeating-linear-gradient(30deg,#95683f,#95683f 9px,#a7784c 10px,#a7784c 18px);border:3px solid #75532e;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-direction:column;color:white;position:relative;min-width:0;padding:0}.plot .plant{font-size:clamp(15px,4.7vw,31px);text-shadow:0 2px #553}.plot small{font-size:9px;background:#27462bd6;border-radius:5px;padding:1px 3px}.plot.planned{outline:4px solid #fce08a;outline-offset:-4px}.plot.ready{background:#6d9b42}.cropbar{display:flex;gap:7px;overflow-x:auto;padding:8px 0}.cropbar button{border:2px solid #d5e0c9;border-radius:10px;background:#f8f6e9;min-width:84px;padding:6px}.cropbar button.selected{border-color:#327f4a;background:#d5f0ce}.badge{display:inline-block;border-radius:7px;background:#f5e7ad;padding:3px 7px;font-size:12px;font-weight:700}.customer{display:flex;align-items:center;gap:12px;background:#f6f0df;padding:12px;border-radius:16px}.face{font-size:55px}.order{padding:9px;background:#edf4e3;border-radius:10px;margin:9px 0}.money{display:flex;gap:7px;flex-wrap:wrap}.money button{border:2px solid #8dba87;border-radius:10px;background:#d6ead0;color:#225331;padding:10px 12px;font-weight:900;min-width:60px}.money .coin{border-radius:50%;min-width:54px;height:54px;background:#e8d2a2;border-color:#ba9a58}.progress{height:15px;border-radius:10px;background:#d9e0cd;overflow:hidden}.progress>div{height:100%;background:#4c9d59}.notice{background:#fff0c5;padding:9px;border-radius:10px;margin:8px 0}.inventory{display:flex;flex-wrap:wrap;gap:8px}.inventory>span{background:#eef2df;border-radius:10px;padding:8px}.foot{text-align:center;padding:20px;color:#74806d;font-size:12px}@media(min-width:700px){.main{padding:20px 28px}.cards{grid-template-columns:repeat(4,minmax(0,1fr))}.town{min-height:530px}.building{min-width:170px}.building span{font-size:75px}.towncenter{font-size:18px}.plot .plant{font-size:40px}.plot small{font-size:12px}}
</style></head><body><div class="app"><header class="header"><h1>🌱 My Garden Grows</h1><div>My First Garden · Storybook prototype 0.3</div><div class="stats" id="stats"></div></header><nav class="tabs" id="tabs"></nav><main class="main"><div id="msg" class="message"></div><div id="screen"></div></main><div class="foot">🌻 A playful learning prototype · All prices and money are fictional · Saved in this browser</div></div><script>
'use strict';
const crops=[{id:'carrot',name:'Carrots',icon:'🥕',seed:'🥕',cost:1,price:2,unit:'each',yield:2,days:3,repeat:0,sun:'Full sun',tip:'Plant with room for roots to grow.'},{id:'corn',name:'Corn',icon:'🌽',seed:'🌽',cost:2,price:3,unit:'each',yield:2,days:5,repeat:0,sun:'Full sun',tip:'Corn grows tall and can shade nearby plants.'},{id:'beans',name:'Green beans',icon:'🫘',seed:'🫘',cost:2,price:4,unit:'lb',yield:1,days:3,repeat:2,sun:'Full sun',tip:'Climbing beans need a little support.'},{id:'strawberry',name:'Strawberries',icon:'🍓',seed:'🌱',cost:3,price:6,unit:'lb',yield:1,days:4,repeat:2,sun:'Full sun',tip:'These plants can give several harvests.'},{id:'cucumber',name:'Cucumbers',icon:'🥒',seed:'🌱',cost:2,price:3,unit:'each',yield:2,days:4,repeat:2,sun:'Full sun',tip:'Give vines room to spread.'},{id:'potato',name:'Potatoes',icon:'🥔',seed:'🥔',cost:2,price:2,unit:'lb',yield:3,days:5,repeat:0,sun:'Full sun',tip:'Plant seed potatoes beneath the soil.'},{id:'onion',name:'Onions',icon:'🧅',seed:'🧅',cost:1,price:2,unit:'each',yield:2,days:4,repeat:0,sun:'Full sun',tip:'Bulbs need space to grow.'}];
const rewards=[['Soccer ball','⚽',100],['Bicycle','🚲',250],['Tablet','📱',500],['Treehouse','🏡',800]];
const names=['Maya','Oliver','Ava','Leo','Sofia','Noah','Lily','Ethan','Isabella','Ben','Grace','Mateo','Zoe','Amir','Emma','Kai','Ruby','Henry','Nina','Sam'];
const faces=['👧🏽','👦🏼','👩🏻','👨🏾','👧🏻','👴🏼','👩🏽','👦🏿','👩🏼','🧑🏻','👧🏾','👨🏻','👩🏿','👦🏽','👵🏻','🧑🏾','👩🏼','👨🏽','👧🏼','👨🏼'];
const blank=()=>({money:50,day:1,goal:1,view:'town',message:'Welcome! Your grown-up has a challenge for you: choose a dream, then grow and sell produce to save for it.',seeds:{},cart:{},standCart:{},supply:{table:false,canopy:false,bags:false},garden:Array(36).fill(null),plan:{},selected:'carrot',inventory:{},customer:null,customerIndex:0,stage:'welcome',change:0,weather:'sunny',lastWater:0,sales:0});
let state;try{state=JSON.parse(localStorage.getItem('mgg_v03'))||blank();if(!Array.isArray(state.garden)||state.garden.length!==36)state=blank()}catch(e){state=blank()}
const $=id=>document.getElementById(id), crop=id=>crops.find(c=>c.id===id), money=n=>'$'+n.toFixed(2), count=(o,k)=>o[k]||0, has=(k)=>!!state.supply[k];
function save(){try{localStorage.setItem('mgg_v03',JSON.stringify(state))}catch(e){}}function say(t){state.message=t;render()}function view(v){state.view=v;state.message=({town:'Tap a building to visit it!',dream:'Choose a dream to save for, then leave the store.',seeds:'Add seeds to your cart. You only pay when you check out.',garden:'Select a seed, tap plots to plan, then press Plant selected plots.',stand:'Set up your market stand before selling.',market:'Welcome to the market! Serve customers and practice making change.'})[v]||'';render()}
function changeGoal(i){state.goal=i;say('Great choice! You are saving for a '+rewards[i][0].toLowerCase()+'. Visit the seed store next!')}
function setQty(id,n,which='cart'){state[which][id]=Math.max(0,Math.min(50,count(state[which],id)+n));render()}
function checkout(){let total=crops.reduce((a,c)=>a+count(state.cart,c.id)*c.cost,0);if(total===0)return say('Choose some seeds first.');if(total>state.money)return say('Not enough money! Remove something from your cart or choose a smaller amount.');state.money-=total;crops.forEach(c=>{state.seeds[c.id]=count(state.seeds,c.id)+count(state.cart,c.id)});state.cart={};say('🛍️ Checkout complete! You spent '+money(total)+'. Your seed packets are in your garden bag.')}
function buyBundle(){const pack={carrot:3,onion:2,beans:2,strawberry:1};const price=11;if(state.money<price)return say('You need $11.00 for the variety bundle.');state.money-=price;Object.entries(pack).forEach(([id,n])=>state.seeds[id]=count(state.seeds,id)+n);say('📦 Bought the $11 variety bundle: 3 carrots, 2 onions, 2 beans, and 1 strawberry. Individual cost would be $13.00, so you saved $2.00!')}
function chooseSeed(id){state.selected=id;render()}
function tapPlot(i){let p=state.garden[i];if(p){if(p.ready){let c=crop(p.id);state.inventory[p.id]=count(state.inventory,p.id)+c.yield;if(p.remaining>0){p.remaining--;p.age=0;p.ready=false}else state.garden[i]=null;return say('🧺 Harvested '+c.yield+' '+c.unit+' of '+c.name.toLowerCase()+'! '+(p.remaining>0?'This plant can produce again.':'This plot is ready for new seeds.'))}return say('🌿 This plant is still growing. Water and advance the day.')}if(state.plan[i]){delete state.plan[i];return say('Planting plan adjusted. That plot is empty again.')}if(count(state.seeds,state.selected)-Object.values(state.plan).filter(x=>x===state.selected).length<=0)return say('You have no unplanned '+crop(state.selected).name.toLowerCase()+' seeds. Buy more or choose another seed.');state.plan[i]=state.selected;say('Seed packet placed! Tap another empty plot to move the plan, or confirm planting below.')}
function plant(){let entries=Object.entries(state.plan);if(!entries.length)return say('Tap some empty plots to arrange seed packets first.');entries.forEach(([i,id])=>{state.garden[+i]={id,age:0,ready:false,remaining:crop(id).repeat,watered:true};state.seeds[id]--});state.plan={};say('🌱 Planted '+entries.length+' plots! You can water them and advance the day to grow.')}
function water(){state.garden.forEach(p=>{if(p)p.watered=true});say('💧 Your garden is watered!')}
function nextDay(){state.day++;let heat=state.day%7===0;state.weather=heat?'hot':'sunny';let ready=0;state.garden.forEach(p=>{if(!p||p.ready)return;if(p.watered){p.age++;p.watered=false}else if(state.day%3===0){p.age=Math.max(0,p.age-1)}if(p.age>=crop(p.id).days){p.ready=true;ready++}});say((heat?'☀️ Hot day! Keep your crops watered. ':'🌤️ A new day begins! ')+(ready?ready+' plots are ready to harvest.':'Check your garden for growing crops.'))}
function buySupply(id){let prices={table:8,canopy:10,bags:3};if(has(id))return;if(state.money<prices[id])return say('You need '+money(prices[id])+' for this supply.');state.money-=prices[id];state.supply[id]=true;say('Purchased '+id+'! '+(id==='table'?'You can now open your market stand.':'Your stand is looking better.'))}
function createCustomer(){if(!has('table'))return say('You need a table before you can serve customers. Visit Stand first.');let i=state.customerIndex%names.length;let available=crops.filter(c=>count(state.inventory,c.id)>0);let items=[];if(available.length){let chosen=available[(i*3+state.day)%available.length];items.push({id:chosen.id,qty:Math.min(count(state.inventory,chosen.id),1+i%2)});if(available.length>1&&i%3!==0){let second=available[(available.indexOf(chosen)+1)%available.length];items.push({id:second.id,qty:1})}}else{let c=crops[i%crops.length];items=[{id:c.id,qty:1}]};if(i%5===4){let c=crops[(i+3)%crops.length];items=[{id:c.id,qty:1}]};state.customer={i,items,greeted:false};state.stage='greet';state.change=0;say(names[i]+' has arrived at your stand!')}
function greet(g){if(!state.customer)return;state.customer.greeted=true;state.stage='order';say(g==='friendly'?'😊 Your customer smiles and looks at your produce.':'Your customer tells you what they need.')}
function totalOrder(){return state.customer?state.customer.items.reduce((s,o)=>s+crop(o.id).price*o.qty,0):0}
function fulfill(){let missing=state.customer.items.filter(o=>count(state.inventory,o.id)<o.qty);if(missing.length){state.stage='goodbye';return say('Sorry, you are out of '+missing.map(x=>crop(x.id).name.toLowerCase()).join(' and ')+'. This customer cannot buy their order today.')}state.stage='cash';state.change=0;say('The order costs '+money(totalOrder())+'. Count change back to the customer!')}
function paid(){let total=totalOrder();return total<=5?10:total<=10?20:Math.ceil(total/20)*20}
function addChange(n){state.change=Math.round((state.change+n)*100)/100;let target=paid()-totalOrder();if(state.change>target+.001)state.message='That is too much change. Tap Reset change to try again.';else if(Math.abs(state.change-target)<.001){state.customer.items.forEach(o=>state.inventory[o.id]-=o.qty);state.money+=totalOrder();state.sales+=totalOrder();state.stage='goodbye';state.message='🎉 Correct! You counted back '+money(target)+' and earned '+money(totalOrder())+'. Say goodbye to your customer!'}else state.message='Counted back '+money(state.change)+' of '+money(target)+'. Keep going!';render()}
function goodbye(){state.customerIndex++;state.customer=null;state.stage='welcome';say('👋 Customer leaves the stand. Ready for the next visitor!')}
function resetGame(){if(!confirm('Start a brand-new garden? This erases this browser’s current game progress.'))return;state=blank();render()}
function nav(){return [['town','🏡 Town'],['dream','🎯 Dream Shop'],['seeds','🌰 Seed Store'],['garden','🌱 Garden'],['stand','🏪 Stand'],['market','🧑‍🌾 Market']].map(([v,t])=>`<button class="${state.view===v?'active':''}" onclick="view('${v}')">${t}</button>`).join('')}
function town(){return `<div class="panel"><h2>🏡 Welcome to your village!</h2><p class="muted">Your family has given you a small garden plot. Visit the shops, grow vegetables, and sell your harvest to earn your dream reward.</p><div class="town"><div class="path"></div><button class="building b-dream" onclick="view('dream')"><span>🏠</span>Dream Shop</button><button class="building b-seeds" onclick="view('seeds')"><span>🏪</span>Seed & Feed</button><button class="building b-garden" onclick="view('garden')"><span>🪴</span>My Garden</button><button class="building b-market" onclick="view('market')"><span>🍎</span>Farmers Market</button><div class="towncenter">👩‍🌾 “Here's your plot! Pick a dream at the shop, buy seeds, then grow something wonderful.”</div></div></div><div class="panel"><h3>Today's farm journal</h3><p>🌤️ Day ${state.day} · ${state.garden.filter(Boolean).length} growing plots · ${Object.values(state.inventory).reduce((a,b)=>a+b,0)} harvested items</p><div class="row"><button class="btn primary" onclick="nextDay()">🌅 End Day →</button><button class="btn" onclick="view('stand')">🛒 Buy stand supplies</button></div></div>`}
function dream(){return `<div class="panel store"><div class="storetop">🎁 Dream Shop</div><p>What are you saving for? Pick one goal, then head back to town.</p><div class="cards">${rewards.map((r,i)=>`<div class="card ${state.goal===i?'selected':''}"><div class="bigemoji">${r[1]}</div><b>${r[0]}</b><div>${money(r[2])}</div><button class="btn ${state.goal===i?'primary':''}" onclick="changeGoal(${i})">${state.goal===i?'✓ Selected':'Choose dream'}</button></div>`).join('')}</div><p><b>Saved:</b> ${money(state.money)} / ${money(rewards[state.goal][2])}</p><div class="progress"><div style="width:${Math.min(100,100*state.money/rewards[state.goal][2])}%"></div></div><p>${state.money>=rewards[state.goal][2]?'🎉 You reached your dream! You can keep growing or start again.':'Keep growing and selling to reach your goal.'}</p><button class="btn primary" onclick="view('town')">🚪 Leave shop</button></div>`}
function seeds(){let total=crops.reduce((a,c)=>a+count(state.cart,c.id)*c.cost,0);return `<div class="panel store"><div class="storetop">🏪 Local Seed & Feed</div><div class="customer"><span class="face">👨‍🌾</span><div>“Welcome! Tap + to add seeds to your cart. Nothing is purchased until you check out.”</div></div><div class="notice">💡 Expensive plants may earn more at market. Compare growing time, harvest, and sale price!</div><div class="card"><b>📦 Variety seed bundle — $11.00</b><div class="muted">Includes 3 carrot, 2 onion, 2 bean, and 1 strawberry packets. Individually $13.00. Save $2.00, but you cannot choose the mix.</div><button class="btn primary" onclick="buyBundle()">Buy variety bundle</button></div>${crops.map(c=>`<div class="shoprow"><div class="ico">${c.seed}</div><div class="info"><b>${c.name}</b><div class="price">${money(c.cost)} per packet</div><div class="muted">Sell for about ${money(c.price)}/${c.unit} · Yield ${c.yield} ${c.unit}${c.repeat?' × '+(c.repeat+1)+' harvests':''} · ${c.days} days</div><details><summary class="muted">🌤️ Planting advice</summary><p class="muted">${c.sun}. ${c.tip} Estimated gross sales: ${money(c.price*c.yield*(c.repeat+1))} if all harvests sell.</p></details></div><div class="stepper"><button onclick="setQty('${c.id}',-1)">−</button><strong>${count(state.cart,c.id)}</strong><button onclick="setQty('${c.id}',1)">+</button></div></div>`).join('')}<div class="sticky"><div class="row spread"><b>🛒 ${Object.values(state.cart).reduce((a,b)=>a+b,0)} packets · ${money(total)}</b><button class="btn primary" onclick="checkout()">✓ Check out</button></div><div class="muted">Available cash: ${money(state.money)}</div></div><button class="btn" onclick="view('town')">🚪 Leave store</button></div>`}
function garden(){let selected=crop(state.selected);return `<div class="panel"><h2>🌱 Your Garden · 6 × 6 plots</h2><p class="muted">First arrange packets. Tap a planned plot to remove it, select another seed, or confirm planting. Once planted, crops cannot be moved.</p><div class="cropbar">${crops.map(c=>`<button class="${state.selected===c.id?'selected':''}" onclick="chooseSeed('${c.id}')"><div style="font-size:25px">${c.seed}</div><b>${c.name}</b><div class="muted">Bag: ${count(state.seeds,c.id)}</div></button>`).join('')}</div><div class="notice">${selected.icon} <b>${selected.name}:</b> ${selected.days} days · ${selected.sun} · ${selected.tip} Estimated sale ${money(selected.price)}/${selected.unit}.</div><div class="gridgarden">${state.garden.map((p,i)=>{let planned=state.plan[i];let c=p?crop(p.id):planned?crop(planned):null;return `<button class="plot ${planned?'planned':''} ${p&&p.ready?'ready':''}" onclick="tapPlot(${i})"><span class="plant">${p?(p.ready?c.icon:p.age===0?'🌰':p.age<c.days-1?'🌱':'🌿'):planned?c.seed:'·'}</span>${p?`<small>${p.ready?'HARVEST':p.age+'/'+c.days+'d'}</small>`:planned?'<small>PLAN</small>':''}</button>`}).join('')}</div><div class="row"><button class="btn primary" onclick="plant()">🌱 Plant selected plots (${Object.keys(state.plan).length})</button><button class="btn" onclick="water()">💧 Water all</button><button class="btn warn" onclick="nextDay()">🌅 End day</button></div><p class="muted">Tap a fully grown crop to harvest it. Beans, strawberries, and cucumbers can grow again after harvesting.</p></div><div class="panel"><h3>🧺 Harvest basket</h3><div class="inventory">${crops.filter(c=>count(state.inventory,c.id)).map(c=>`<span>${c.icon} ${c.name}: ${count(state.inventory,c.id)} ${c.unit}</span>`).join('')||'Nothing harvested yet.'}</div><p><button class="btn" onclick="view('stand')">Go to your market stand →</button></p></div>`}
function stand(){let supplies=[['table','🪵','Market table',8],['canopy','⛱️','Shade canopy',10],['bags','🛍️','Produce bags',3]];return `<div class="panel store"><div class="storetop">🏪 Market Supply Store</div><p>Buy what you need to set up your stand. You must have a table to sell produce.</p>${supplies.map(([id,ico,name,price])=>`<div class="shoprow"><div class="ico">${ico}</div><div class="info"><b>${name}</b><div>${money(price)}</div></div><button class="btn ${has(id)?'':'primary'}" onclick="buySupply('${id}')" ${has(id)?'disabled':''}>${has(id)?'✓ Owned':'Buy'}</button></div>`).join('')}<p><button class="btn primary" onclick="view('market')">🚪 Visit your stand</button></p></div><div class="panel"><h3>📦 Your stand inventory</h3><div class="inventory">${crops.filter(c=>count(state.inventory,c.id)).map(c=>`<span>${c.icon} ${c.name}: ${count(state.inventory,c.id)} ${c.unit}</span>`).join('')||'Harvest crops in your garden to stock the stand.'}</div></div>`}
function market(){let c=state.customer;let i=c?c.i:0;let total=totalOrder();let target=paid()-total;return `<div class="panel store"><div class="storetop">🍎 Your Farmers Market</div><div class="notice">${has('table')?'🪵 Table ready':'⚠️ You need a market table before selling.'} ${has('canopy')?'⛱️ Canopy up!':''} ${has('bags')?'🛍️ Bags ready!':''}</div><div class="inventory">${crops.filter(x=>count(state.inventory,x.id)).map(x=>`<span>${x.icon} ${x.name}: ${count(state.inventory,x.id)} ${x.unit} · ${money(x.price)}/${x.unit}</span>`).join('')||'Your crates are empty. Harvest produce in the garden!'}</div><hr style="border:0;border-top:2px dashed #d9bd8d;margin:15px 0">${!c?`<div class="customer"><span class="face">🧑‍🌾</span><div>Ready for your next customer? People may ask for produce you don't have.</div></div><p><button class="btn primary" onclick="createCustomer()">🔔 Welcome next customer</button></p>`:`<div class="customer"><span class="face">${faces[i]}</span><div><b>${names[i]}</b><div>“${state.stage==='greet'?'Hello!':state.stage==='order'?'Could I buy these items, please?':state.stage==='cash'?'Here is '+money(paid())+'.':'Thanks for your help!'}”</div></div></div>${state.stage==='greet'?`<p>How will you greet ${names[i]}?</p><div class="row"><button class="btn primary" onclick="greet('friendly')">😊 Hi! What can I get for you?</button><button class="btn" onclick="greet('short')">Hello.</button></div>`:''}${['order','cash','goodbye'].includes(state.stage)?`<div class="order"><b>🧺 Customer's shopping list</b>${c.items.map(o=>`<div class="row spread"><span>${crop(o.id).icon} ${o.qty} ${crop(o.id).unit} ${crop(o.id).name}</span><b>${money(crop(o.id).price*o.qty)}</b></div>`).join('')}<hr><div class="row spread"><b>Total</b><b>${money(total)}</b></div></div>`:''}${state.stage==='order'?`<p>Check your inventory and the total. Can you fill the order?</p><button class="btn primary" onclick="fulfill()">🧺 Prepare order</button>`:''}${state.stage==='cash'?`<p><b>Customer pays:</b> ${money(paid())} · <b>Purchase:</b> ${money(total)}</p><p><b>Change to count back:</b> ${money(target)}</p><div class="notice">You've counted back <b>${money(state.change)}</b>. ${money(total+state.change)} of ${money(paid())} reached.</div><p>Tap bills and coins to give change:</p><div class="money">${[1,5,10,20,.25,.10,.05,.01].map(n=>`<button class="${n<1?'coin':''}" onclick="addChange(${n})">${n<1?Math.round(n*100)+'¢':'$'+n}</button>`).join('')}</div><p><button class="btn" onclick="state.change=0;say('Change reset. Start counting again!')">↺ Reset change</button></p>`:''}${state.stage==='goodbye'?`<p>Choose a friendly goodbye:</p><div class="row"><button class="btn primary" onclick="goodbye()">👋 Thank you! Come again!</button><button class="btn" onclick="goodbye()">Have a great day!</button></div>`:''}`}</div><div class="panel"><h3>💰 Sales so far: ${money(state.sales)}</h3><p class="muted">Customers served: ${state.customerIndex}. There are 20 different neighbors to meet.</p><button class="btn" onclick="view('town')">🏡 Back to town</button></div>`}
function render(){save();$('stats').innerHTML=`<span class="pill">💵 ${money(state.money)}</span><span class="pill">☀️ Season ${Math.floor((state.day-1)/20)+1} · Day ${((state.day-1)%20)+1}/20</span><span class="pill">🎯 ${rewards[state.goal][1]} ${money(rewards[state.goal][2])}</span>`;$('tabs').innerHTML=nav();$('msg').textContent=state.message;$('screen').innerHTML=({town,dream,seeds,garden,stand,market})[state.view]();}
render();
</script></body></html>
